name: Update VRChat Group List

on:
  schedule:
    # Runs automatically every 6 hours (Adjust using cron syntax if needed)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger the script using a button on GitHub

permissions:
  contents: write # Grants the action permission to push the updated text file back to your repo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code into the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Python on the machine
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install required library
      - name: Install Dependencies
        run: pip install requests

      # 4. Run the script using your hidden GitHub secrets
      - name: Fetch Group Members
        env:
          VRC_AUTH_COOKIE: ${{ secrets.VRC_AUTH_COOKIE }}
          VRC_2FA_COOKIE: ${{ secrets.VRC_2FA_COOKIE }}
        run: python get_members.py
      # 5. Automatically commit and push the updated group_members.txt back to your repo
      - name: Commit and Push Changes
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "actions@github.com"
          git add group_members.txt
          git diff-index --quiet HEAD || git commit -m "Automated update of VRChat group member list"
          git push
